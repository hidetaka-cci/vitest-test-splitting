version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:22.14
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Create test results directory
          command: mkdir -p test-results
      - run:
          name: Run all tests (no split)
          command: CI=true npx vitest run
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  verify:
    jobs:
      - test
