version: 2.1

orbs:
  node: circleci/node@7.2.1

jobs:
  test:
    docker:
      - image: cimg/node:22.14
    resource_class: medium
    parallelism: 4
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Create test results directory
          command: mkdir -p test-results
      - run:
          name: Run tests with split
          command: |
            circleci tests glob "src/**/*.test.ts" \
              | circleci tests run --command "xargs -r npx vitest run" \
                  --split-by=timings --timings-type=filename --verbose
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  verify:
    jobs:
      - test
